<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750">
  <defs>
    <linearGradient id="vbBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#181512"/>
      <stop offset="100%" stop-color="#241E1A"/>
    </linearGradient>
    <linearGradient id="vbGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#221C18"/>
      <stop offset="100%" stop-color="#1A1512"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="750" fill="url(#vbBg)"/>

  <!-- Top Luxury Navbar -->
  <rect x="0" y="0" width="1200" height="80" fill="#13100E" stroke="#2E2620" stroke-width="1"/>
  <text x="60" y="48" font-family="'Cinzel', Georgia, serif" font-size="22" font-weight="700" letter-spacing="3" fill="#FBBF24">VENICIO</text>
  <text x="180" y="48" font-family="'Cinzel', Georgia, serif" font-size="12" letter-spacing="4" fill="#A89F91">BOUTIQUE</text>

  <!-- Navigation Links -->
  <text x="500" y="46" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#E5E0D8" letter-spacing="1">COLLECTIONS</text>
  <text x="640" y="46" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#A89F91" letter-spacing="1">NEW ARRIVALS</text>
  <text x="790" y="46" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#A89F91" letter-spacing="1">EDITORIAL</text>

  <rect x="1020" y="24" width="120" height="36" rx="18" fill="url(#vbGold)"/>
  <text x="1055" y="47" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#181512">CART (2)</text>

  <!-- Editorial Hero Banner -->
  <rect x="60" y="110" width="1080" height="240" rx="16" fill="url(#cardGrad)" stroke="#3D322A" stroke-width="1.5"/>
  <text x="100" y="165" font-family="'Cinzel', Georgia, serif" font-size="36" font-weight="600" fill="#FFF">AUTUMN / WINTER APPAREL</text>
  <text x="100" y="200" font-family="system-ui,sans-serif" font-size="16" fill="#C5BAAF">Crafted contemporary tailoring, premium textiles, and effortless style.</text>
  <rect x="100" y="235" width="160" height="42" rx="8" fill="url(#vbGold)"/>
  <text x="135" y="261" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#181512">EXPLORE DROP →</text>

  <!-- Product Showcase Grid -->
  <!-- Product 1 -->
  <rect x="60" y="380" width="340" height="330" rx="14" fill="#1C1714" stroke="#2E2620" stroke-width="1"/>
  <rect x="80" y="400" width="300" height="200" rx="10" fill="#29221D"/>
  <circle cx="230" cy="500" r="45" fill="#3D322A"/>
  <text x="215" y="508" font-family="serif" font-size="28" fill="#D97706">✦</text>
  <text x="80" y="630" font-family="system-ui,sans-serif" font-size="15" font-weight="600" fill="#F5F2EB">The Monogram Oversized Blazer</text>
  <text x="80" y="655" font-family="system-ui,sans-serif" font-size="13" fill="#A89F91">Bespoke wool blend · Double-breasted</text>
  <text x="80" y="685" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#FBBF24">₦ 125,000</text>
  <rect x="290" y="662" width="90" height="32" rx="6" fill="#2E2620"/>
  <text x="312" y="682" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#F5F2EB">+ Add</text>

  <!-- Product 2 -->
  <rect x="430" y="380" width="340" height="330" rx="14" fill="#1C1714" stroke="#2E2620" stroke-width="1"/>
  <rect x="450" y="400" width="300" height="200" rx="10" fill="#29221D"/>
  <circle cx="600" cy="500" r="45" fill="#3D322A"/>
  <text x="585" y="508" font-family="serif" font-size="28" fill="#D97706">✦</text>
  <text x="450" y="630" font-family="system-ui,sans-serif" font-size="15" font-weight="600" fill="#F5F2EB">Silk Trench Coat in Obsidian</text>
  <text x="450" y="655" font-family="system-ui,sans-serif" font-size="13" fill="#A89F91">Water-repellent raw silk finish</text>
  <text x="450" y="685" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#FBBF24">₦ 180,000</text>
  <rect x="660" y="662" width="90" height="32" rx="6" fill="#2E2620"/>
  <text x="682" y="682" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#F5F2EB">+ Add</text>

  <!-- Product 3 -->
  <rect x="800" y="380" width="340" height="330" rx="14" fill="#1C1714" stroke="#2E2620" stroke-width="1"/>
  <rect x="820" y="400" width="300" height="200" rx="10" fill="#29221D"/>
  <circle cx="970" cy="500" r="45" fill="#3D322A"/>
  <text x="955" y="508" font-family="serif" font-size="28" fill="#D97706">✦</text>
  <text x="820" y="630" font-family="system-ui,sans-serif" font-size="15" font-weight="600" fill="#F5F2EB">Tailored Pleated Trousers</text>
  <text x="820" y="655" font-family="system-ui,sans-serif" font-size="13" fill="#A89F91">High-waist architectural silhouette</text>
  <text x="820" y="685" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#FBBF24">₦ 65,000</text>
  <rect x="1030" y="662" width="90" height="32" rx="6" fill="#2E2620"/>
  <text x="1052" y="682" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#F5F2EB">+ Add</text>
</svg>
